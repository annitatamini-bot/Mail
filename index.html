<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mail</title>
    <style>
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --card-strong: #eef3ff;
        --text: #111111;
        --muted: #6e6e73;
        --separator: #d1d1d6;
        --blue: #007aff;
        --blue-soft: rgba(0, 122, 255, 0.12);
        --shadow: rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(1100px, 100%);
        height: min(780px, calc(100vh - 48px));
        background: var(--card);
        border: 1px solid var(--separator);
        border-radius: 28px;
        box-shadow: 0 18px 50px var(--shadow);
        overflow: hidden;
        display: grid;
        grid-template-columns: 360px 1fr;
      }

      .sidebar {
        background: rgba(255,255,255,0.9);
        border-right: 1px solid var(--separator);
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 20px 18px 14px;
        border-bottom: 1px solid var(--separator);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 1.2rem;
      }

      .badge {
        background: var(--blue-soft);
        color: var(--blue);
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .mail-list {
        overflow: auto;
        padding: 8px;
      }

      .mail-item {
        border: 1px solid transparent;
        background: transparent;
        width: 100%;
        text-align: left;
        border-radius: 18px;
        padding: 14px 12px;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }

      .mail-item:hover {
        background: rgba(0,0,0,0.02);
      }

      .mail-item.active {
        background: var(--card-strong);
        border-color: rgba(0,122,255,0.15);
      }

      .mail-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .mail-item-name {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mail-item-date {
        color: var(--muted);
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .mail-item-subject {
        margin-top: 4px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mail-item-preview {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .detail-header {
        padding: 22px 26px 14px;
        border-bottom: 1px solid var(--separator);
      }

      .detail-subject {
        margin: 0;
        font-size: clamp(1.45rem, 2vw, 2.1rem);
        line-height: 1.2;
      }

      .detail-meta {
        margin-top: 10px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .detail-body {
        padding: 22px 26px;
        overflow: auto;
        flex: 1;
      }

      .message-body {
        background: rgba(0,0,0,0.01);
        border: 1px solid var(--separator);
        border-radius: 18px;
        padding: 18px;
        line-height: 1.6;
        white-space: pre-wrap;
        color: #1f1f1f;
      }

      .date-panel {
        padding: 0 26px 24px;
        border-top: 1px solid var(--separator);
      }

      .date-card {
        margin-top: 18px;
        background: rgba(0,122,255,0.04);
        border: 1px solid rgba(0,122,255,0.15);
        border-radius: 16px;
        padding: 16px;
      }

      .date-card label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .date-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .date-row input {
        flex: 1;
        min-width: 220px;
        padding: 12px 14px;
        border: 1px solid var(--separator);
        border-radius: 12px;
        background: white;
        font: inherit;
        color: var(--text);
      }

      .date-row button {
        background: var(--blue);
        color: white;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }

      .date-row button:hover {
        filter: brightness(1.04);
      }

      @media (max-width: 900px) {
        body {
          padding: 0;
        }

        .app {
          width: 100%;
          height: 100vh;
          border-radius: 0;
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--separator);
          max-height: 40vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="header">
          <div class="title-row">
            <h1>Messages envoyés</h1>
            <span class="badge" id="countBadge">0</span>
          </div>
        </div>
        <div class="mail-list" id="mailList"></div>
      </aside>

      <main class="detail">
        <div class="detail-header">
          <h2 class="detail-subject" id="detailSubject">Sélectionnez un message</h2>
          <div class="detail-meta">
            <span id="detailTo">À :</span>
            <span>•</span>
            <span id="detailDate">Date</span>
          </div>
        </div>

        <div class="detail-body">
          <div class="message-body" id="detailBody">
            Sélectionnez un message dans la liste pour voir son contenu.
          </div>
        </div>

        <div class="date-panel">
          <div class="date-card">
            <label for="dateInput">Modifier la date d'envoi</label>
            <div class="date-row">
              <input id="dateInput" type="datetime-local" />
              <button id="saveDateBtn" type="button">Enregistrer</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const STORAGE_KEY = 'mail-app-sent-messages-v1';

      const defaultMessages = [
        {
          id: 1,
          to: 'Claire Martin',
          subject: 'Réunion de projet',
          body: 'Bonjour Claire,\n\nMerci pour le dossier de suivi. Je suis disponible ce mercredi après-midi pour valider les derniers points.\n\nÀ tout de suite,\nAlexandre',
          date: '2026-09-17T09:15:00'
        },
        {
          id: 2,
          to: 'Sophie Dubois',
          subject: 'Facture du mois',
          body: 'Bonjour Sophie,\n\nLa facture du mois a été mise à jour et le paiement peut être effectué à partir de ce jour.\n\nCordialement,\nAlexandre',
          date: '2026-09-15T16:45:00'
        },
        {
          id: 3,
          to: 'Équipe marketing',
          subject: 'Campagne lancement',
          body: 'Bonjour,\n\nLes visuels de la campagne de lancement sont prêts et le calendrier de diffusion est validé. Merci de confirmer les derniers points avant demain matin.\n\nBien à vous,\nAlexandre',
          date: '2026-09-12T12:00:00'
        }
      ];

      let messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultMessages;
      let selectedId = messages[0]?.id || null;

      const listEl = document.getElementById('mailList');
      const countBadge = document.getElementById('countBadge');
      const detailSubject = document.getElementById('detailSubject');
      const detailTo = document.getElementById('detailTo');
      const detailDate = document.getElementById('detailDate');
      const detailBody = document.getElementById('detailBody');
      const dateInput = document.getElementById('dateInput');
      const saveDateBtn = document.getElementById('saveDateBtn');

      function saveMessages() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }

      function formatDisplayDate(value) {
        const date = new Date(value);
        return new Intl.DateTimeFormat('fr-FR', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      }

      function formatShortDate(value) {
        const date = new Date(value);
        return new Intl.DateTimeFormat('fr-FR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }).format(date);
      }

      function toDateTimeLocalValue(value) {
        const date = new Date(value);
        const pad = (n) => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function getSelectedMessage() {
        return messages.find(message => message.id === selectedId) || messages[0] || null;
      }

      function renderList() {
        messages.sort((a, b) => new Date(b.date) - new Date(a.date));

        countBadge.textContent = messages.length;
        listEl.innerHTML = '';

        messages.forEach((message) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'mail-item' + (message.id === selectedId ? ' active' : '');
          item.innerHTML = `
            <div class="mail-item-header">
              <span class="mail-item-name">${message.to}</span>
              <span class="mail-item-date">${formatShortDate(message.date)}</span>
            </div>
            <div class="mail-item-subject">${message.subject}</div>
            <div class="mail-item-preview">${message.body.replace(/\n/g, ' ')}</div>
          `;

          item.addEventListener('click', () => {
            selectedId = message.id;
            render();
          });

          listEl.appendChild(item);
        });
      }

      function renderDetail() {
        const message = getSelectedMessage();
        if (!message) {
          detailSubject.textContent = 'Aucun message';
          detailTo.textContent = 'À :';
          detailDate.textContent = 'Date';
          detailBody.textContent = 'Aucun message disponible.';
          dateInput.value = '';
          return;
        }

        detailSubject.textContent = message.subject;
        detailTo.textContent = `À : ${message.to}`;
        detailDate.textContent = formatDisplayDate(message.date);
        detailBody.textContent = message.body;
        dateInput.value = toDateTimeLocalValue(message.date);
      }

      function render() {
        renderList();
        renderDetail();
      }

      saveDateBtn.addEventListener('click', () => {
        const message = getSelectedMessage();
        if (!message) return;

        const nextDate = dateInput.value;
        if (!nextDate) {
          alert('Veuillez choisir une date valide.');
          return;
        }

        message.date = nextDate;
        saveMessages();
        render();
      });

      render();
    </script>
  </body>
</html>
