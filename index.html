<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f2f7"><title>Mail</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#777;--blue:#087df5;--line:#ddd;--red:#e33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{border:0;background:none;color:var(--blue);cursor:pointer}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}h1{font-size:34px;margin:10px 18px}h2{margin:0 0 5px;font-size:19px}.sub{color:var(--muted);margin:0 18px 16px}.boxes,.list{background:var(--card);margin:0 14px;border-radius:20px;overflow:hidden}.box{display:flex;align-items:center;gap:14px;padding:17px 18px;border-bottom:1px solid var(--line);font-size:19px}.box:last-child{border:0}.count{margin-left:auto;color:var(--muted)}.scroll{height:calc(100vh - 64px);overflow:auto;padding-bottom:30px}.search{margin:10px 14px;padding:10px 14px;border-radius:12px;background:#e5e5ea;border:0;width:calc(100% - 28px);outline:0}.msg{display:flex;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}.msg:hover{background:#f5f5f5}.avatar{width:37px;height:37px;border-radius:50%;background:#779bd5;color:#fff;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}.meta{min-width:0;flex:1}.top{display:flex;justify-content:space-between;gap:8px}.sender{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{color:var(--muted);font-size:13px;white-space:nowrap}.subject{font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{padding:0 18px 30px}.back{font-size:17px;padding:12px 0}.detail-head{display:flex;gap:12px;align-items:flex-start}.detail-date{margin-left:auto;text-align:right;color:var(--muted);font-size:13px}.body{white-space:pre-wrap;line-height:1.5;font-size:17px;margin-top:22px}.fab{position:fixed;right:20px;bottom:20px;border-radius:50%;background:var(--blue);color:white;width:58px;height:58px;font-size:28px;box-shadow:0 4px 16px #999}.modal{position:fixed;inset:0;background:#0005;display:grid;align-items:end}.sheet{background:var(--card);border-radius:25px 25px 0 0;padding:18px;max-height:94vh;overflow:auto}.sheet h2{text-align:center;margin-bottom:12px}.field{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.field label{color:var(--muted);min-width:105px}.field input,.field textarea{border:0;outline:0;background:none;width:100%;padding:7px}.field textarea{min-height:160px;resize:vertical}.actions{display:flex;justify-content:space-between;padding-top:14px}.primary{background:var(--blue);color:#fff;border-radius:18px;padding:9px 18px}.danger{color:var(--red)}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:70px 20px}
</style></head>
<body><main id="app"></main><button id="compose" class="fab" aria-label="Nouveau message">＋</button><script>
(function(){'use strict';
var KEY='mail-perso-v3-demo',now=Date.now(),day=86400000;
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function initials(s){return String(s||'?').split(/\s+/).map(function(x){return x[0]}).join('').slice(0,2).toUpperCase()}
function dateText(ts){return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function seed(){
 var cats=[
  ['YouTube','youtube.com','Nouvelles vidéos recommandées'],['Journal du matin','journal-info.fr','Votre revue de presse quotidienne'],['Info 24','actualites.fr','Les informations importantes du jour'],['Culture générale','savoirs.fr','Le saviez-vous ?'],['TikTok','tiktok.com','Les tendances que vous avez peut-être manquées'],['Bourse d’étude','opportunites-edu.org','Nouvelles opportunités de bourses'],['YouTube','youtube.com','Votre sélection personnalisée'],['Journal économique','eco-actualites.fr','L’essentiel de l’économie']
 ];
 var a=[];for(var i=0;i<108;i++){var c=cats[i%cats.length],ts=new Date(2026,0,5,8,15).getTime()+Math.floor(i*(now-new Date(2026,0,5).getTime())/107);a.push({id:uid(),box:'sent',read:true,date:ts,from:{name:c[0],email:'notifications@'+c[1]},to:{name:'Moi',email:'moi@icloud.com'},subject:c[2],body:'Bonjour,\n\nVoici votre notification automatique concernant '+c[0]+'. Consultez les nouveautés, recommandations et informations disponibles dans votre espace.\n\nCeci est un message de démonstration de votre boîte Mail.'})}
 var specialTs=now-14*day;a.push({id:uid(),box:'sent',read:true,date:specialTs,from:{name:'Equipe juridiqueSONABHY',email:'sonabhy@sonabhy.bf'},to:{name:'Mme TAMINI',email:'moi@icloud.com'},subject:'Acceptation de votre stage de 3 mois - Direction Juridique SONABHY',body:'Bonjour Mme TAMINI,\n\nNous avons le plaisir de vous confirmer l’acceptation de votre stage d’une durée de 3 mois au sein de la Direction Juridique de la SONABHY.\n\nPour préparer votre arrivée et finaliser votre dossier, veuillez accéder à votre espace d’accueil via le lien ci-dessous et renseigner votre code employé : 4021. Code valable au plus tard le 28 septembre.\n\nCordialement,\nEquipe juridiqueSONABHY'});return{me:{name:'Moi',email:'moi@icloud.com'},msgs:a}}
var S;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S||!S.msgs)S=seed();function save(){localStorage.setItem(KEY,JSON.stringify(S))}
var view='boxes',current=null,query='';function items(){return S.msgs.filter(function(m){return m.box==='sent'&&(!query||[m.from.name,m.from.email,m.subject,m.body].join(' ').toLowerCase().includes(query.toLowerCase()))}).sort(function(a,b){return b.date-a.date})}
function render(){var app=document.getElementById('app');if(view==='boxes'){app.innerHTML='<header><strong>Mail</strong><button id="reset">Réinitialiser</button></header><div class="scroll"><h1>Boîtes</h1><p class="sub">Mise à jour à l’instant</p><div class="boxes"><button class="box" id="sent">✈️ <span>Envoyés</span><span class="count">'+S.msgs.filter(function(m){return m.box==='sent'}).length+'</span> ›</button></div></div>';document.getElementById('sent').onclick=function(){view='sent';render()};document.getElementById('reset').onclick=function(){if(confirm('Réinitialiser les messages de démonstration ?')){S=seed();save();render()}};return}if(view==='sent'){app.innerHTML='<header><button id="home">‹ Boîtes</button><strong>Envoyés</strong><button id="new">Nouveau</button></header><div class="scroll"><input class="search" id="search" placeholder="Rechercher" value="'+esc(query)+'"><div class="list">'+(items().map(function(m){return '<div class="msg" data-id="'+m.id+'"><div class="avatar">'+esc(initials(m.from.name))+'</div><div class="meta"><div class="top"><span class="sender">'+esc(m.from.name)+'</span><span class="date">'+dateText(m.date)+'</span></div><div class="subject">'+esc(m.subject)+'</div><div class="preview">'+esc(m.body.replace(/\s+/g,' ').slice(0,150))+'</div></div></div>'}).join('')||'<div class="empty">Aucun message</div>')+'</div></div>';document.getElementById('home').onclick=function(){view='boxes';query='';render()};document.getElementById('new').onclick=compose;document.getElementById('search').oninput=function(e){query=e.target.value;render();document.getElementById('search').focus()};document.querySelectorAll('.msg').forEach(function(x){x.onclick=function(){current=S.msgs.find(function(m){return m.id===x.dataset.id});view='detail';render()}});return}if(view==='detail'){var m=current;app.innerHTML='<header><button id="back">‹ Envoyés</button><button id="editDate">Modifier la date</button></header><div class="scroll detail"><div class="detail-head"><div class="avatar">'+esc(initials(m.from.name))+'</div><div><h2>'+esc(m.from.name)+'</h2><div class="sub">'+esc(m.from.email)+'<br>À : '+esc(m.to.email)+'</div></div><div class="detail-date">'+dateText(m.date)+'</div></div><h2>'+esc(m.subject)+'</h2><div class="body">'+esc(m.body)+'</div></div>';document.getElementById('back').onclick=function(){view='sent';render()};document.getElementById('editDate').onclick=function(){var v=prompt('Nouvelle date (AAAA-MM-JJTHH:MM)',new Date(m.date).toISOString().slice(0,16));if(v){var d=new Date(v);if(!isNaN(d)){m.date=d.getTime();save();render()}else alert('Date invalide')}}}}
function compose(){var modal=document.createElement('div');modal.className='modal';modal.innerHTML='<form class="sheet"><h2>Nouveau message envoyé</h2><div class="field"><label>Destinataire</label><input name="to" value="moi@icloud.com"></div><div class="field"><label>Objet</label><input name="subject" required></div><div class="field"><label>Date d’envoi</label><input name="date" type="datetime-local" value="'+new Date().toISOString().slice(0,16)+'" required></div><div class="field"><label>Message</label><textarea name="body" required></textarea></div><div class="actions"><button type="button" class="danger" id="cancel">Annuler</button><button class="primary">Envoyer</button></div></form>';document.body.appendChild(modal);modal.querySelector('#cancel').onclick=function(){modal.remove()};modal.querySelector('form').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),d=new Date(f.get('date'));S.msgs.push({id:uid(),box:'sent',read:true,date:d.getTime(),from:S.me,to:{name:'',email:f.get('to')},subject:f.get('subject'),body:f.get('body')});save();modal.remove();view='sent';render()}}
document.getElementById('compose').onclick=compose;render();
})();</script></body></html>
