<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mail</title>
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mail">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --text:#000000; --sub:#8a8a8e;
  --sep:#d1d1d6; --blue:#007aff; --yellow:#ffcc00; --red:#ff3b30; --fill:#e6e6eb; --chev:#c4c4c7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --text:#ffffff; --sub:#98989f;
    --sep:#38383a; --blue:#0a84ff; --yellow:#ffd60a; --red:#ff453a; --fill:#2c2c2e; --chev:#59595e;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --text:#ffffff; --sub:#98989f;
  --sep:#38383a; --blue:#0a84ff; --yellow:#ffd60a; --red:#ff453a; --fill:#2c2c2e; --chev:#59595e;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{-webkit-user-select:text;user-select:text}
.ic{width:24px;height:24px;flex:none;display:block}
.chev{stroke-width:2.4;color:var(--chev);width:18px;height:18px}

/* pages */
.page{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .34s cubic-bezier(.32,.72,0,1);box-shadow:-10px 0 30px rgba(0,0,0,.07);
}
.page.detail{background:var(--card)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 4px;min-height:58px;flex:none}
.nav.end{justify-content:flex-end}
.nav .grp{display:flex;align-items:center;gap:6px}
.page.detail .nav{background:var(--card)}
.back{display:flex;align-items:center;color:var(--blue);font-size:19px;gap:0;margin-left:-6px;padding:8px 6px}
.back .ic{width:28px;height:28px;stroke-width:2.4}
.txt{color:var(--blue);font-size:19px;padding:10px 6px}
.txt[disabled]{opacity:.35}
.pill{background:var(--card);border-radius:24px;padding:12px 24px;font-size:19px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.arrow{width:40px;height:40px;display:grid;place-items:center;color:var(--blue)}
.arrow[disabled]{opacity:.3}
.arrow .ic{width:26px;height:26px;stroke-width:2.4}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h1.large{font-size:35px;font-weight:800;letter-spacing:-.4px;margin:12px 18px 2px;line-height:1.15}
.subl{color:var(--sub);font-size:18px;margin:0 18px 18px}

/* boîtes */
.card{background:var(--card);border-radius:26px;margin:0 16px 8px;overflow:hidden}
.row{display:flex;align-items:center;height:56px;padding:0 18px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:18px;height:.5px;background:var(--sep)}
.ri{color:var(--blue);width:30px;display:flex}
.ri.y{color:var(--yellow)}
.ri .ic{width:29px;height:29px}
.rl{flex:1;margin-left:16px;font-size:20px}
.rc{color:var(--sub);font-size:20px;margin-right:8px}
.sech{display:flex;justify-content:space-between;align-items:center;margin:26px 30px 12px 34px;font-size:23px;font-weight:700;cursor:pointer}
.sech .ic{color:var(--blue);width:26px;height:26px;stroke-width:2.4;transition:transform .2s}
.sech .rot{transform:rotate(-90deg)}
.fab{
  position:absolute;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--card);
  box-shadow:0 4px 20px rgba(0,0,0,.13);display:grid;place-items:center;
}
.fab .ic{width:27px;height:27px}

/* liste */
.search{margin:6px 16px 12px;background:var(--fill);border-radius:12px;height:40px;display:flex;align-items:center;padding:0 10px;gap:6px;color:var(--sub)}
.search .ic{width:20px;height:20px}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--text);min-width:0;font-family:inherit}
.list{background:var(--card);min-height:60%}
.msg{position:relative;display:flex;padding:11px 16px 12px 12px;cursor:pointer}
.msg+.msg::before{content:"";position:absolute;top:0;left:34px;right:0;height:.5px;background:var(--sep)}
.lead{width:22px;flex:none;padding-top:5px;display:flex;justify-content:flex-start}
.dot{display:block;width:11px;height:11px;border-radius:50%;background:var(--blue);margin-left:3px}
.dot.off{background:transparent}
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--sub);position:relative}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk.on::after{content:"";position:absolute;left:6.5px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.mb{flex:1;min-width:0;margin-left:8px}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{color:var(--sub);font-size:15px;display:flex;align-items:center;gap:2px;flex:none}
.dt .chev{width:14px;height:14px}
.subj{font-size:15px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev{color:var(--sub);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.empty{padding:70px 24px;text-align:center;color:var(--sub);font-size:22px;font-weight:600}
.tb{
  flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 20px 10px;
  background:var(--bg);border-top:.5px solid var(--sep);min-height:58px;
}
.page.detail .tb{background:var(--card);display:flex;justify-content:space-around}
.tb .ic{width:26px;height:26px;color:var(--blue)}
.tb .mid{text-align:center;font-size:12px;line-height:1.35}
.tb .mid span{display:block;color:var(--sub)}
.tb .r{display:flex;justify-content:flex-end}
.tb .tbtn{color:var(--blue);font-size:18px;padding:8px 4px}
.tb .tbtn[disabled]{opacity:.35}
.tb .tbtn.del{color:var(--red)}
.tb .ibtn{padding:8px;display:grid;place-items:center}

/* détail */
.dh{display:flex;gap:12px;padding:12px 18px 6px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none}
.dm{flex:1;min-width:0}
.dn{font-weight:600;font-size:17px;cursor:pointer}
.dto{color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd{color:var(--sub);font-size:14px;text-align:right;max-width:38%;line-height:1.25}
.ds{font-size:21px;font-weight:700;margin:12px 18px 14px;line-height:1.25;overflow-wrap:anywhere}
.db{padding:0 18px 40px;font-size:17px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}

/* écriture */
#ov{position:absolute;inset:0;z-index:20;pointer-events:none}
#ov.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .3s}
.csheet{
  position:absolute;left:0;right:0;bottom:0;top:34px;background:var(--card);border-radius:38px 38px 0 0;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -6px 30px rgba(0,0,0,.15);
}
#ov.on .scrim{opacity:1}
#ov.on .csheet{transform:none}
.chead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px 8px;flex:none}
.chead .txt{justify-self:start;padding-left:4px}
.ctitle{font-weight:700;font-size:18px}
.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;justify-self:end}
.send .ic{stroke-width:2.6;width:22px;height:22px}
.send[disabled]{background:var(--fill);color:var(--sub)}
.cscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.f{display:flex;align-items:center;padding:0 20px;min-height:50px;border-bottom:.5px solid var(--sep);gap:8px}
.f label{color:var(--sub);font-size:17px;flex:none}
.f input,.f select{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;color:var(--text);padding:13px 0;font-family:inherit}
.f .fixed{flex:1;padding:13px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f select{color:var(--blue);text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none}
.hint{color:var(--sub);font-size:13px;padding:8px 20px 0}
.cbody{
  display:block;width:100%;border:0;outline:0;background:none;resize:none;font-family:inherit;font-size:17px;
  color:var(--text);padding:16px 20px 90px;min-height:260px;line-height:1.4;
}

/* feuille d'actions */
#as{position:absolute;inset:0;z-index:40;display:none}
#as.on{display:block}
.asb{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.asp{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
.asg{background:var(--card2);border-radius:22px;overflow:hidden}
.asg .ti{padding:14px 16px;text-align:center;color:var(--sub);font-size:13px;border-bottom:.5px solid var(--sep)}
.asg button{display:block;width:100%;padding:17px;text-align:center;font-size:20px;color:var(--blue);border-top:.5px solid var(--sep)}
.asg .ti+button,.asg button:first-child{border-top:0}
.asg button.del{color:var(--red)}
.asg button.cancel{font-weight:600}

/* bannière et toast */
.banner{
  position:absolute;left:10px;right:10px;top:6px;z-index:50;background:var(--card2);border-radius:26px;padding:12px 16px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;cursor:pointer;
  transform:translateY(-170%);transition:transform .42s cubic-bezier(.32,.72,0,1);
}
.banner.on{transform:none}
.bi{width:38px;height:38px;border-radius:9px;background:linear-gradient(#3aa0ff,#0a62f0);color:#fff;display:grid;place-items:center;flex:none}
.bi .ic{width:22px;height:22px}
.bt{min-width:0;flex:1}
.bt .r1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:16px}
.bt .r1 span:last-child{color:var(--sub);font-weight:400;font-size:14px}
.bt .r1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .r2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .r3{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{
  position:absolute;left:50%;bottom:84px;z-index:45;background:rgba(40,40,44,.94);color:#fff;font-size:16px;
  padding:12px 20px;border-radius:22px;transform:translate(-50%,20px);opacity:0;transition:all .3s;pointer-events:none;max-width:88%;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ .page,.csheet,.scrim,.banner,.toast{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div id="as"></div>
<div id="banner" class="banner" data-act="banner-open"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';
var K = 'mail-perso-v1';
var $ = function(s){ return document.querySelector(s); };

/* ---------- icônes ---------- */
var ICONS = {
  tray:'<path d="M3.2 12.8l2.3-7A2 2 0 0 1 7.4 4.4h9.2a2 2 0 0 1 1.9 1.4l2.3 7"/><path d="M3.2 12.8v5a2 2 0 0 0 2 2h13.6a2 2 0 0 0 2-2v-5h-5.3a3 3 0 0 1-5.5 0z"/>',
  star:'<path d="M12 3.4l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.7l6-.8z"/>',
  unread:'<rect x="2.8" y="6.4" width="16.6" height="13" rx="2.2"/><path d="M3.6 7.9l7.5 5.6 7.6-5.6"/><circle cx="19.6" cy="5" r="2.7" fill="currentColor" stroke="none"/>',
  env:'<rect x="3" y="5.5" width="18" height="13.5" rx="2.2"/><path d="M3.8 7.2l8.2 6 8.2-6"/>',
  doc:'<path d="M6.5 3h7.3l4.7 4.7v11.8a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3z"/><path d="M13.5 3v4.8h4.8"/>',
  send:'<path d="M21 3.5L3.2 10.6l6.6 2.8 2.9 6.9z"/><path d="M21 3.5L9.8 13.4"/>',
  junk:'<rect x="3" y="3.8" width="18" height="4.4" rx="1.2"/><path d="M4.8 8.2v9.6a2 2 0 0 0 2 2h10.4a2 2 0 0 0 2-2V8.2"/><path d="M9.6 11.6l4.8 4.8M14.4 11.6l-4.8 4.8"/>',
  trash:'<path d="M4 6.8h16"/><path d="M9 6.8V4h6v2.8"/><path d="M6.2 6.8l1 13.2h9.6l1-13.2"/><path d="M10 10.5v6M14 10.5v6"/>',
  compose:'<path d="M11.5 4H6.2A2.2 2.2 0 0 0 4 6.2v11.6A2.2 2.2 0 0 0 6.2 20h11.6a2.2 2.2 0 0 0 2.2-2.2v-5.3"/><path d="M18.4 3.4a1.8 1.8 0 0 1 2.5 2.5L12 14.8l-3.4.9.9-3.4z"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  chevl:'<path d="M15 5l-7 7 7 7"/>',
  chevd:'<path d="M5 9l7 7 7-7"/>',
  chevu:'<path d="M5 15l7-7 7 7"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.3"/><path d="M15.3 15.3L20 20"/>',
  reply:'<path d="M9.5 6L4 11.5 9.5 17"/><path d="M4 11.5h9a6.5 6.5 0 0 1 6.5 6.5v1"/>',
  up:'<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>'
};
function svg(n, cls){
  return '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
}

/* ---------- utilitaires ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function slug(s){ var t = norm(s).replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,''); return t || 'expediteur'; }
function hhmm(d){ return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtShort(ts){
  var d = new Date(ts), n = new Date();
  if (sameDay(d,n)) return hhmm(d);
  var y = new Date(n.getTime()-86400000);
  if (sameDay(d,y)) return 'Hier';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtLong(ts){
  var d = new Date(ts);
  if (sameDay(d,new Date())) return "Aujourd\u2019hui à " + hhmm(d);
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}) + ' à ' + hhmm(d);
}
function preview(m){ return String(m.body||'').replace(/\s+/g,' ').trim().slice(0,160); }
function initials(name){
  var p = String(name||'?').trim().split(/\s+/).filter(Boolean);
  var s = (p[0]||'?').charAt(0) + (p.length>1 ? p[p.length-1].charAt(0) : '');
  return s.toUpperCase();
}
var AV = ['#8e8e93','#5b8fd6','#d68a5b','#4fae86','#a172d6','#d6605b','#c9a23c'];
function avColor(s){ var h=0; s=String(s||''); for (var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return AV[h%AV.length]; }

/* ---------- données ---------- */
function seed(){
  var now = Date.now();
  return {
    me:{name:'Moi', email:'moi@icloud.com'},
    vips:[], pending:[], icloud:true,
    msgs:[{
      id:uid(), from:{name:'Mail', email:'bonjour@mail.app'}, to:{name:'Moi', email:'moi@icloud.com'},
      subject:'Bienvenue dans votre boîte Mail',
      body:"Voici votre boîte Mail personnelle.\n\nTouchez le bouton d\u2019écriture en bas à droite pour vous envoyer un message : choisissez le nom de l\u2019expéditeur, écrivez l\u2019objet et le texte, puis envoyez.\n\nLe message arrive dans Réception comme s\u2019il venait de l\u2019extérieur. Vous pouvez le recevoir tout de suite ou après quelques secondes ou minutes.",
      date:now, read:false, box:'inbox'
    }]
  };
}
function load(){
  try{
    var r = localStorage.getItem(K);
    if (r){ var o = JSON.parse(r); if (o && o.msgs && o.me) { o.pending = o.pending||[]; o.vips = o.vips||[]; return o; } }
  }catch(e){}
  return seed();
}
var S = load();
function save(){ try{ localStorage.setItem(K, JSON.stringify(S)); }catch(e){} }
function byId(id){ for (var i=0;i<S.msgs.length;i++) if (S.msgs[i].id===id) return S.msgs[i]; return null; }
function removeMsg(id){ S.msgs = S.msgs.filter(function(m){ return m.id!==id; }); }
function isVip(email){ return S.vips.indexOf(String(email||'').toLowerCase())>-1; }

var BOXES = {
  inbox:  {name:'Réception',   icon:'tray',   f:function(m){ return m.box==='inbox'; }},
  vip:    {name:'VIP',         icon:'star',   f:function(m){ return m.box==='inbox' && isVip(m.from.email); }},
  unread: {name:'Non lus',     icon:'unread', f:function(m){ return m.box==='inbox' && !m.read; }},
  drafts: {name:'Brouillons',  icon:'doc',    f:function(m){ return m.box==='drafts'; }},
  sent:   {name:'Envoyés',     icon:'send',   f:function(m){ return m.box==='sent'; }},
  junk:   {name:'Indésirables',icon:'junk',   f:function(m){ return m.box==='junk'; }},
  trash:  {name:'Corbeille',   icon:'trash',  f:function(m){ return m.box==='trash'; }}
};
function count(k){
  var n = 0;
  S.msgs.forEach(function(m){
    if (!BOXES[k].f(m)) return;
    if (k==='sent' || k==='trash') return;
    if (k==='drafts' || !m.read) n++;
  });
  return n;
}
function listItems(e){
  var a = S.msgs.filter(BOXES[e.box].f);
  if (e.q){
    var q = norm(e.q);
    a = a.filter(function(m){ return norm(m.from.name+' '+m.from.email+' '+(m.to&&m.to.name)+' '+m.subject+' '+m.body).indexOf(q)>-1; });
  }
  a.sort(function(x,y){ return y.date-x.date; });
  return a;
}
function whoOf(m){
  if (m.box==='sent') return 'À : ' + ((m.to&&(m.to.name||m.to.email)) || '—');
  if (m.box==='drafts') return (m.draft && m.draft.mode==='reply') ? ('À : ' + ((m.to&&(m.to.name||m.to.email))||'—')) : (m.draft&&m.draft.fromName ? m.draft.fromName : 'Sans expéditeur');
  return m.from.name;
}

/* ---------- pages ---------- */
var app = $('#app');
var stack = [];
function top(){ return stack[stack.length-1]; }

function pageBoxes(){
  function row(k){
    var b = BOXES[k], n = count(k);
    return '<div class="row" data-act="open-box" data-box="'+k+'" role="button">'
      + '<span class="ri'+(k==='vip'?' y':'')+'">'+svg(b.icon)+'</span>'
      + '<span class="rl">'+b.name+'</span>'
      + '<span class="rc">'+(n||'')+'</span>'+svg('chev','chev')+'</div>';
  }
  var open = S.icloud !== false;
  return '<div class="nav end"><button class="pill" data-act="menu">Modifier</button></div>'
    + '<div class="scroll"><h1 class="large">Boîtes</h1><div class="subl">MÀJ à l\u2019instant</div>'
    + '<div class="card">'+row('inbox')+row('vip')+row('unread')+'</div>'
    + '<div class="sech" data-act="toggle-icloud"><span>iCloud</span>'+svg('chevd', open?'':'rot')+'</div>'
    + (open ? '<div class="card">'+['drafts','sent','junk','trash'].map(row).join('')+'</div>' : '')
    + '<div style="height:100px"></div></div>'
    + '<button class="fab" data-act="compose" aria-label="Nouveau message">'+svg('compose')+'</button>';
}
function rowsHTML(e){
  var items = listItems(e);
  if (!items.length) return '<div class="empty">'+(e.q?'Aucun résultat':'Aucun message')+'</div>';
  return items.map(function(m){
    var sel = e.sel.has(m.id);
    var lead = e.edit ? '<span class="chk'+(sel?' on':'')+'"></span>' : '<span class="dot'+(m.read||m.box==='drafts'?' off':'')+'"></span>';
    return '<div class="msg" data-act="open-msg" data-id="'+m.id+'" role="button">'
      + '<div class="lead">'+lead+'</div>'
      + '<div class="mb"><div class="l1"><span class="who">'+esc(whoOf(m))+'</span>'
      + '<span class="dt">'+fmtShort(m.date)+svg('chev','chev')+'</span></div>'
      + '<div class="subj">'+esc(m.subject)+'</div><div class="prev">'+esc(preview(m))+'</div></div></div>';
  }).join('');
}
function pageList(e){
  var b = BOXES[e.box], n = count(e.box);
  var tb;
  if (e.edit){
    var has = e.sel.size>0;
    tb = '<div class="tb"><div><button class="tbtn" data-act="sel-read" '+(has?'':'disabled')+'>Lu / Non lu</button></div><div></div>'
       + '<div class="r"><button class="tbtn del" data-act="sel-del" '+(has?'':'disabled')+'>'+(e.box==='trash'?'Supprimer':'Corbeille')+'</button></div></div>';
  } else {
    tb = '<div class="tb"><div></div><div class="mid">MÀJ à l\u2019instant'+(e.box==='inbox'||e.box==='unread'||e.box==='vip'?'<span>'+n+(n>1?' non lus':' non lu')+'</span>':'')+'</div>'
       + '<div class="r"><button class="ibtn" data-act="compose" aria-label="Nouveau message">'+svg('compose')+'</button></div></div>';
  }
  return '<div class="nav"><button class="back" data-act="back">'+svg('chevl')+'<span>Boîtes</span></button>'
    + '<button class="txt" data-act="edit">'+(e.edit?'Terminé':'Modifier')+'</button></div>'
    + '<div class="scroll"><h1 class="large">'+b.name+'</h1>'
    + '<div class="search">'+svg('search')+'<input id="q" type="search" placeholder="Rechercher" enterkeyhint="search" autocomplete="off" value="'+esc(e.q)+'"></div>'
    + '<div class="list">'+rowsHTML(e)+'</div></div>' + tb;
}
function pageDetail(e){
  e.ctx = e.ctx.filter(function(id){ return !!byId(id); });
  var m = byId(e.id);
  if (!m) return '<div class="nav"><button class="back" data-act="back">'+svg('chevl')+'<span>Retour</span></button></div><div class="scroll"></div>';
  var i = e.ctx.indexOf(e.id);
  var toLine = (m.box==='sent') ? ((m.to&&(m.to.name||m.to.email))||'') : (m.to && (m.to.name||m.to.email)) || S.me.name;
  return '<div class="nav"><button class="back" data-act="back">'+svg('chevl')+'<span>'+esc(BOXES[e.box].name)+'</span></button>'
    + '<div class="grp"><button class="arrow" data-act="prev" '+(i<=0?'disabled':'')+' aria-label="Message précédent">'+svg('chevu')+'</button>'
    + '<button class="arrow" data-act="next" '+(i<0||i>=e.ctx.length-1?'disabled':'')+' aria-label="Message suivant">'+svg('chevd')+'</button></div></div>'
    + '<div class="scroll"><div class="dh"><div class="av" style="background:'+avColor(m.from.name)+'">'+esc(initials(m.from.name))+'</div>'
    + '<div class="dm"><div class="dn" data-act="sender">'+esc(m.from.name)+(isVip(m.from.email)?' \u2605':'')+'</div><div class="dto">À : '+esc(toLine)+'</div></div>'
    + '<div class="dd">'+esc(fmtLong(m.date))+'</div></div>'
    + '<h2 class="ds">'+esc(m.subject)+'</h2><div class="db">'+esc(m.body)+'</div></div>'
    + '<div class="tb"><button class="ibtn" data-act="trash-msg" aria-label="Corbeille">'+svg('trash')+'</button>'
    + '<button class="ibtn" data-act="reply" aria-label="Répondre">'+svg('reply')+'</button>'
    + '<button class="ibtn" data-act="compose" aria-label="Nouveau message">'+svg('compose')+'</button></div>';
}
function render(e){
  var sc = e.el.querySelector('.scroll'); var st = sc ? sc.scrollTop : 0;
  e.el.innerHTML = e.t==='boxes' ? pageBoxes(e) : e.t==='list' ? pageList(e) : pageDetail(e);
  var sc2 = e.el.querySelector('.scroll'); if (sc2) sc2.scrollTop = st;
}
function refreshAll(){ stack.forEach(render); }

function push(e, animate){
  var prev = top();
  e.el = document.createElement('div');
  e.el.className = 'page ' + e.t;
  stack.push(e);
  render(e);
  if (animate){
    e.el.style.transform = 'translateX(100%)';
    app.appendChild(e.el);
    void e.el.offsetWidth;
    requestAnimationFrame(function(){
      e.el.style.transform = '';
      if (prev) prev.el.style.transform = 'translateX(-28%)';
    });
  } else {
    app.appendChild(e.el);
    if (prev) prev.el.style.transform = 'translateX(-28%)';
  }
}
function pop(){
  if (stack.length<2) return;
  var e = stack.pop(), prev = top();
  e.el.style.transform = 'translateX(100%)';
  prev.el.style.transform = '';
  setTimeout(function(){ e.el.remove(); }, 360);
  refreshAll();
}
function markRead(id, v){ var m = byId(id); if (m && m.box!=='drafts' && m.read!==v){ m.read = v; save(); } }
function openDetail(id, box, ctx){
  markRead(id, true);
  push({t:'detail', id:id, box:box, ctx:ctx}, true);
  stack.forEach(function(x){ if (x.t!=='detail') render(x); });
}
function openMessage(id){
  var m = byId(id); if (!m) return;
  hideBanner(); closeCompose(true);
  while (stack.length>1){ stack.pop().el.remove(); }
  stack[0].el.style.transform = '';
  var box = BOXES[m.box] ? m.box : 'inbox';
  if (m.box==='drafts'){ openDraft(m); return; }
  var le = {t:'list', box:box, edit:false, sel:new Set(), q:''};
  push(le, false);
  openDetail(id, box, listItems(le).map(function(x){ return x.id; }));
}

/* ---------- feuille d'actions ---------- */
function actionSheet(title, actions){
  var el = $('#as');
  el.innerHTML = '<div class="asb" data-act="as-close"></div><div class="asp"><div class="asg">'
    + (title?'<div class="ti">'+esc(title)+'</div>':'')
    + actions.filter(function(a){ return !a.cancel; }).map(function(a,i){ return '<button class="'+(a.del?'del':'')+'" data-as="'+i+'">'+esc(a.label)+'</button>'; }).join('')
    + '</div><div class="asg"><button class="cancel" data-act="as-close">Annuler</button></div></div>';
  el._actions = actions.filter(function(a){ return !a.cancel; });
  el.classList.add('on');
}
function closeSheet(){ var el = $('#as'); el.classList.remove('on'); el.innerHTML=''; el._actions=null; }

/* ---------- bannière et toast ---------- */
var bannerTimer, bannerId = null;
function showBanner(m, n){
  bannerId = m.id;
  var b = $('#banner');
  b.innerHTML = '<div class="bi">'+svg('env')+'</div><div class="bt"><div class="r1"><span>'+esc(m.from.name)+'</span><span>maintenant</span></div>'
    + '<div class="r2">'+esc(m.subject)+'</div><div class="r3">'+esc(preview(m))+'</div></div>';
  b.classList.add('on');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(hideBanner, 5000);
  try{ if (navigator.vibrate) navigator.vibrate(30); }catch(e){}
}
function hideBanner(){ clearTimeout(bannerTimer); $('#banner').classList.remove('on'); }
var toastTimer;
function toast(t){
  var el = $('#toast'); el.textContent = t; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2600);
}

/* ---------- écriture ---------- */
var C = null;
function cValid(){
  if (!C) return false;
  var f = C.f;
  return C.mode==='in' ? (f.fromName.trim() && (f.subject.trim() || f.body.trim())) : !!f.body.trim();
}
function cDirty(){
  if (!C) return false;
  var f = C.f;
  var has = f.fromName.trim() || f.fromEmail.trim() || f.body.trim() || (C.mode==='in' && f.subject.trim());
  return !!has && JSON.stringify(f) !== C.init;
}
function field(label, key, opts){
  opts = opts||{};
  return '<div class="f"><label>'+label+'</label><input data-f="'+key+'" type="'+(opts.type||'text')+'" '
    + (opts.mode?'inputmode="'+opts.mode+'" ':'') + 'autocomplete="off" autocapitalize="'+(opts.cap||'sentences')+'" autocorrect="off" '
    + 'placeholder="'+esc(opts.ph||'')+'" value="'+esc(C.f[key])+'"></div>';
}
function composeHTML(){
  var f = C.f, inMode = C.mode==='in';
  var delays = [['0','Immédiatement'],['10','Dans 10 secondes'],['60','Dans 1 minute'],['300','Dans 5 minutes']];
  var top;
  if (inMode){
    top = field('De :','fromName',{ph:"Nom de l\u2019expéditeur",cap:'words'})
        + field('Adresse :','fromEmail',{ph:'facultatif',type:'email',mode:'email',cap:'none'})
        + field('À :','to',{type:'email',mode:'email',cap:'none'})
        + field('Objet :','subject',{})
        + '<div class="f"><label>Réception :</label><select data-f="delay">'
        + delays.map(function(d){ return '<option value="'+d[0]+'"'+(f.delay===d[0]?' selected':'')+'>'+d[1]+'</option>'; }).join('')
        + '</select></div>';
  } else {
    top = '<div class="f"><label>De :</label><div class="fixed">'+esc(S.me.name+' <'+S.me.email+'>')+'</div></div>'
        + '<div class="f"><label>À :</label><div class="fixed">'+esc((f.toName?f.toName+' ':'')+'<'+f.to+'>')+'</div></div>'
        + field('Objet :','subject',{});
  }
  return '<div class="scrim" data-act="ccancel"></div><div class="csheet" role="dialog" aria-label="Nouveau message">'
    + '<div class="chead"><button class="txt" data-act="ccancel">Annuler</button><div class="ctitle">'+(inMode?'Nouveau message':'Répondre')+'</div>'
    + '<button id="csend" class="send" data-act="csend" aria-label="Envoyer" '+(cValid()?'':'disabled')+'>'+svg('up')+'</button></div>'
    + '<div class="cscroll">'+top
    + '<textarea class="cbody" data-f="body" placeholder="Écrivez le message…">'+esc(f.body)+'</textarea></div></div>';
}
function openCompose(mode, opts){
  opts = opts||{};
  C = {mode:mode, draftId:opts.draftId||null,
    f:Object.assign({fromName:'',fromEmail:'',to:S.me.email,toName:'',subject:'',body:'',delay:'0'}, opts.f||{})};
  C.init = JSON.stringify(C.f);
  var ov = $('#ov');
  ov.innerHTML = composeHTML();
  void ov.offsetWidth;
  ov.classList.add('on');
  var first = ov.querySelector(mode==='in' ? '[data-f="fromName"]' : '[data-f="body"]');
  if (first){ try{ first.focus({preventScroll:true}); }catch(e){ first.focus(); } }
}
function openDraft(m){
  var d = m.draft || {mode:'in'};
  openCompose(d.mode, {draftId:m.id, f:{
    fromName:d.fromName||'', fromEmail:d.fromEmail||'', to:(m.to&&m.to.email)||S.me.email, toName:(m.to&&m.to.name)||'',
    subject:m.subject==='(Sans objet)'?'':m.subject, body:m.body||'', delay:d.delay||'0'
  }});
}
function closeCompose(instant){
  var ov = $('#ov');
  ov.classList.remove('on');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  var c = C; C = null;
  setTimeout(function(){ if (!C) ov.innerHTML = ''; }, instant?0:420);
  return c;
}
function cancelCompose(){
  if (!C) return;
  if (!cDirty()){ closeCompose(); return; }
  actionSheet(null, [
    {label:'Supprimer le brouillon', del:true, fn:function(){ if (C && C.draftId){ removeMsg(C.draftId); save(); refreshAll(); } closeCompose(); }},
    {label:'Enregistrer le brouillon', fn:saveDraft}
  ]);
}
function saveDraft(){
  if (!C) return;
  var f = C.f;
  var msg = {
    id:C.draftId||uid(), box:'drafts', read:true, date:Date.now(),
    from:{name:S.me.name, email:S.me.email}, to:{name:f.toName||'', email:f.to||''},
    subject:f.subject.trim()||'(Sans objet)', body:f.body,
    draft:{mode:C.mode, fromName:f.fromName, fromEmail:f.fromEmail, delay:f.delay}
  };
  removeMsg(msg.id);
  S.msgs.push(msg); save(); closeCompose(); refreshAll();
  toast('Brouillon enregistré');
}
function sendCompose(){
  if (!C || !cValid()) return;
  var f = C.f;
  if (C.draftId) removeMsg(C.draftId);
  if (C.mode==='in'){
    var name = f.fromName.trim();
    var email = f.fromEmail.trim() || (slug(name)+'@exemple.fr');
    var to = f.to.trim() || S.me.email;
    S.me.email = to;
    var msg = {id:uid(), from:{name:name, email:email}, to:{name:S.me.name, email:to},
      subject:f.subject.trim()||'(Sans objet)', body:f.body, date:0, read:false, box:'inbox'};
    var d = parseInt(f.delay,10)||0;
    closeCompose();
    if (d===0){
      msg.date = Date.now(); S.msgs.push(msg); save(); refreshAll();
      setTimeout(function(){ showBanner(msg); }, 500);
    } else {
      S.pending.push({at:Date.now()+d*1000, msg:msg}); save(); refreshAll();
      toast(d<60 ? 'Message reçu dans '+d+' secondes' : 'Message reçu dans '+(d/60)+(d===60?' minute':' minutes'));
    }
  } else {
    S.msgs.push({id:uid(), from:{name:S.me.name, email:S.me.email}, to:{name:f.toName||'', email:f.to},
      subject:f.subject.trim()||'(Sans objet)', body:f.body, date:Date.now(), read:true, box:'sent'});
    save(); closeCompose(); refreshAll();
    toast('Message envoyé');
  }
}
function startReply(id){
  var m = byId(id); if (!m) return;
  var target = (m.box==='sent') ? m.to : m.from;
  var subj = /^re\s*:/i.test(m.subject) ? m.subject : 'Re: '+m.subject;
  openCompose('reply', {f:{to:target.email, toName:target.name||'', subject:subj}});
}

/* ---------- réception différée ---------- */
function tick(){
  var now = Date.now();
  var due = S.pending.filter(function(p){ return p.at<=now; });
  if (!due.length) return;
  S.pending = S.pending.filter(function(p){ return p.at>now; });
  due.forEach(function(p){ p.msg.date = p.at; S.msgs.push(p.msg); });
  save(); refreshAll();
  showBanner(due[due.length-1].msg, due.length);
}

/* ---------- actions ---------- */
function trashOne(id){
  var m = byId(id); if (!m) return;
  if (m.box==='trash') removeMsg(id); else { m.prevBox = m.box; m.box = 'trash'; }
}
function act(a, t){
  var e = top();
  switch(a){
    case 'open-box':
      push({t:'list', box:t.dataset.box, edit:false, sel:new Set(), q:''}, true); break;
    case 'back': pop(); break;
    case 'toggle-icloud': S.icloud = (S.icloud===false); save(); render(e); break;
    case 'compose': openCompose('in'); break;
    case 'edit': e.edit = !e.edit; e.sel.clear(); render(e); break;
    case 'open-msg': {
      var id = t.dataset.id, m = byId(id); if (!m) break;
      if (e.edit){ if (e.sel.has(id)) e.sel.delete(id); else e.sel.add(id); render(e); break; }
      if (m.box==='drafts'){ openDraft(m); break; }
      openDetail(id, e.box, listItems(e).map(function(x){ return x.id; }));
      break;
    }
    case 'prev': case 'next': {
      var i = e.ctx.indexOf(e.id), j = i + (a==='prev'?-1:1);
      if (j<0 || j>=e.ctx.length) break;
      e.id = e.ctx[j]; markRead(e.id, true); render(e);
      var sc = e.el.querySelector('.scroll'); if (sc) sc.scrollTop = 0;
      break;
    }
    case 'sel-read': {
      var ids = Array.from(e.sel), anyUnread = ids.some(function(i){ var m=byId(i); return m && !m.read; });
      ids.forEach(function(i){ markRead(i, anyUnread); });
      e.edit = false; e.sel.clear(); save(); refreshAll(); break;
    }
    case 'sel-del':
      Array.from(e.sel).forEach(trashOne);
      e.edit = false; e.sel.clear(); save(); refreshAll(); break;
    case 'trash-msg': {
      var mm = byId(e.id); if (!mm) break;
      if (mm.box==='trash'){
        actionSheet(null, [{label:'Supprimer définitivement', del:true, fn:function(){ removeMsg(e.id); save(); pop(); }}]);
      } else { trashOne(e.id); save(); pop(); }
      break;
    }
    case 'reply': startReply(e.id); break;
    case 'sender': {
      var sm = byId(e.id); if (!sm) break;
      var vip = isVip(sm.from.email);
      actionSheet(sm.from.name+' <'+sm.from.email+'>', [
        {label: vip?'Retirer des VIP':'Ajouter aux VIP', fn:function(){
          var em = sm.from.email.toLowerCase();
          if (vip) S.vips = S.vips.filter(function(x){ return x!==em; }); else S.vips.push(em);
          save(); refreshAll();
        }},
        {label:'Répondre', fn:function(){ startReply(sm.id); }}
      ]);
      break;
    }
    case 'menu':
      actionSheet(null, [
        {label:'Tout marquer comme lu', fn:function(){ S.msgs.forEach(function(m){ if (m.box!=='drafts') m.read = true; }); save(); refreshAll(); }},
        {label:'Vider la corbeille', fn:function(){ S.msgs = S.msgs.filter(function(m){ return m.box!=='trash'; }); save(); refreshAll(); }},
        {label:'Réinitialiser la boîte…', del:true, fn:function(){
          setTimeout(function(){
            actionSheet('Tous les messages seront effacés.', [{label:'Tout effacer', del:true, fn:function(){
              S = seed(); save(); refreshAll();
            }}]);
          }, 50);
        }}
      ]);
      break;
    case 'as-close': closeSheet(); break;
    case 'ccancel': cancelCompose(); break;
    case 'csend': sendCompose(); break;
    case 'banner-open': if (bannerId) openMessage(bannerId); break;
  }
}

/* ---------- événements ---------- */
document.addEventListener('click', function(ev){
  var asBtn = ev.target.closest('#as [data-as]');
  if (asBtn){
    var el = $('#as'), fn = el._actions && el._actions[+asBtn.dataset.as];
    closeSheet();
    if (fn && fn.fn) fn.fn();
    return;
  }
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  act(t.dataset.act, t);
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (el.id==='q'){
    var e = top(); if (!e) return;
    e.q = el.value;
    var list = e.el.querySelector('.list'); if (list) list.innerHTML = rowsHTML(e);
    return;
  }
  var k = el.dataset && el.dataset.f;
  if (!k || !C) return;
  C.f[k] = el.value;
  var b = $('#csend'); if (b) b.disabled = !cValid();
  if (el.tagName==='TEXTAREA'){ el.style.height = 'auto'; el.style.height = Math.max(260, el.scrollHeight)+'px'; }
});
document.addEventListener('change', function(ev){
  var el = ev.target, k = el.dataset && el.dataset.f;
  if (k==='delay' && C){ C.f.delay = el.value; }
});
document.addEventListener('keydown', function(ev){
  if (ev.target.id==='q' && ev.key==='Enter'){ ev.target.blur(); }
});
var tx = null;
document.addEventListener('touchstart', function(ev){
  var t = ev.touches[0]; tx = (t.clientX<24) ? {x:t.clientX, y:t.clientY} : null;
}, {passive:true});
document.addEventListener('touchend', function(ev){
  if (!tx) return;
  var t = ev.changedTouches[0];
  if (t.clientX-tx.x>80 && Math.abs(t.clientY-tx.y)<60 && !C && !$('#as').classList.contains('on')) pop();
  tx = null;
}, {passive:true});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) tick(); });

/* ---------- démarrage ---------- */
push({t:'boxes'}, false);
tick();
setInterval(tick, 1000);
})();
</script>
</body>
</html>
